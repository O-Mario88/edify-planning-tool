# DigitalOcean App Platform specification — Edify STAGING
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ This creates a SEPARATE app. It never touches edify-planning-fra.        │
# │                                                                          │
# │   doctl apps create --spec .do/staging.yaml                              │
# │                                                                          │
# │ Staging tracks the `staging` BRANCH, not `main`. That is deliberate:     │
# │ production deploys on every push to main, so a staging app pointed at    │
# │ main would rebuild in lockstep with production and prove nothing. Push   │
# │ a release candidate to `staging`, verify it, then merge to main.         │
# └──────────────────────────────────────────────────────────────────────────┘
#
# Why staging exists: the ten-role matrix, the end-to-end certification
# journeys, and every destructive/load/rollback test are forbidden against
# production. They need an environment that runs the SAME artifact.
#
# ── Data ─────────────────────────────────────────────────────────────────────
# Staging is SEEDED, never cloned. After the first deploy:
#
#   manage.py stamp_environment --to staging      (type: STAMP staging)
#   manage.py seed --demo
#
# `seed --demo` creates demo accounts for every role plus sample operational
# data. No real school, staff or financial record ever leaves production, so
# the privacy exposure of a database clone does not arise. The command still
# refuses any database stamped 'production', which is the real safety net.
#
# ── Secrets you must set yourself ────────────────────────────────────────────
# Production's secrets are encrypted per-app (EV[1:...]) and CANNOT be copied
# here — by design. Set each REPLACE_ME below in the DO console's environment
# editor (or with `doctl apps update`) so they are stored encrypted.
#
#   SECRET_KEY               generate fresh, do NOT reuse production's
#   FIELD_ENCRYPTION_KEY     generate fresh (see apps/core/crypto.py)
#   SUPER_ADMIN_PASSWORD     staging-only password
#   SPACES_REGION            same region is fine (e.g. fra1)
#   SPACES_ENDPOINT_URL      https://<SPACES_REGION>.digitaloceanspaces.com
#   SPACES_ACCESS_KEY_ID     see the note below
#   SPACES_SECRET_ACCESS_KEY see the note below
#
# Object storage: SPACES_PREFIX is 'edify-staging' below, so staging writes
# under a different prefix from production's 'edify-production'. If you reuse
# production's Spaces key, staging is still technically able to reach the
# production prefix — prefer a dedicated Spaces key scoped to a staging
# bucket if your policy requires hard isolation. This is a decision for you,
# not a default I should pick.

name: edify-staging-fra
region: fra

alerts:
  - rule: DEPLOYMENT_FAILED

databases:
  # Both databases are isolated managed clusters.  App Platform does not offer
  # a dev-tier Valkey component, and using an in-process cache would not exercise
  # the shared-cache, locking, scheduler, or multi-instance behavior that staging
  # exists to certify.
  - name: edifydb
    engine: PG
    version: "17"
    production: true
    cluster_name: edify-staging-pg-fra
    db_name: edify_staging
    db_user: doadmin
  # Pool bindables are exposed for the identity attached to the database
  # component. Keep a second attachment for least-privilege runtime traffic;
  # the migration job continues to use edifydb's direct administrative URL.
  - name: edifyruntime
    engine: PG
    version: "17"
    production: true
    cluster_name: edify-staging-pg-fra
    db_name: edify_staging
    db_user: edify_runtime
  - name: edifycache
    engine: VALKEY
    version: "8"
    production: true
    cluster_name: edify-staging-cache-fra

envs:
  - key: DJANGO_SETTINGS_MODULE
    scope: RUN_AND_BUILD_TIME
    # Inherits every production gate; differs only in IS_PRODUCTION and
    # ENVIRONMENT so demo seeding is permitted and the stamp guard matches.
    value: config.settings.staging
  - key: DATABASE_URL
    scope: RUN_AND_BUILD_TIME
    value: ${edifydb.DATABASE_URL}
  - key: DB_USE_PGBOUNCER
    scope: RUN_AND_BUILD_TIME
    value: "false"
  - key: REDIS_URL
    scope: RUN_TIME
    value: ${edifycache.DATABASE_URL}
  - key: DIGITALOCEAN_APP_DOMAIN
    scope: RUN_AND_BUILD_TIME
    value: ${APP_DOMAIN}

  # Security posture stays identical to production. Staging that is softer
  # than production does not prove the artifact.
  - key: AUTHZ_MODE
    scope: RUN_AND_BUILD_TIME
    value: enforce
  - key: ENABLE_MOCK_DATA
    scope: RUN_AND_BUILD_TIME
    value: "false"
  - key: ENABLE_DEV_ENDPOINTS
    scope: RUN_AND_BUILD_TIME
    value: "false"
  - key: ENABLE_DEV_SEED
    scope: RUN_AND_BUILD_TIME
    value: "false"
  - key: ENABLE_DEV_IMPORTS
    scope: RUN_AND_BUILD_TIME
    value: "false"
  - key: PARTNER_ROLE_BRIDGE
    scope: RUN_AND_BUILD_TIME
    value: "false"
  - key: SECURE_SSL_REDIRECT
    scope: RUN_AND_BUILD_TIME
    value: "true"
  - key: SESSION_COOKIE_SECURE
    scope: RUN_AND_BUILD_TIME
    value: "true"
  - key: CSRF_COOKIE_SECURE
    scope: RUN_AND_BUILD_TIME
    value: "true"

  - key: SUPER_ADMIN_EMAIL
    scope: RUN_AND_BUILD_TIME
    value: edwin.omario@gmail.com
  - key: SPACES_BUCKET_NAME
    scope: RUN_AND_BUILD_TIME
    value: edify-planning-private-uploads-fra
  - key: SPACES_PREFIX
    scope: RUN_AND_BUILD_TIME
    # MUST differ from production's 'edify-production'.
    value: edify-staging

  - key: RUN_MIGRATIONS
    scope: RUN_AND_BUILD_TIME
    value: "false"
  - key: RUN_SEED
    scope: RUN_AND_BUILD_TIME
    value: "false"
  - key: ENABLE_BACKGROUND_JOBS
    scope: RUN_AND_BUILD_TIME
    value: "false"

  # Email stays on the console provider here — no staging run should ever be
  # able to send mail to a real person. This is no longer a boot blocker.
  - key: EMAIL_PROVIDER
    scope: RUN_AND_BUILD_TIME
    value: console

  - key: SECRET_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: REPLACE_ME_generate_a_fresh_staging_secret_key
  - key: FIELD_ENCRYPTION_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: REPLACE_ME_generate_a_fresh_staging_field_key
  - key: SUPER_ADMIN_PASSWORD
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: REPLACE_ME_staging_super_admin_password
  - key: SPACES_REGION
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: REPLACE_ME_spaces_region
  - key: SPACES_ENDPOINT_URL
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: REPLACE_ME_spaces_endpoint_url
  - key: SPACES_ACCESS_KEY_ID
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: REPLACE_ME_spaces_access_key_id
  - key: SPACES_SECRET_ACCESS_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: REPLACE_ME_spaces_secret_access_key

# Migrations run in a PRE_DEPLOY job, exactly as production does — two web
# instances racing `migrate` is the failure this prevents, and staging must
# rehearse the same sequence.
jobs:
  - name: migrate
    kind: PRE_DEPLOY
    dockerfile_path: /Dockerfile
    source_dir: /
    github:
      branch: staging
      deploy_on_push: true
      repo: O-Mario88/edify-planning-tool
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    run_command: python manage.py migrate_locked --noinput
    envs:
      - key: RUN_MIGRATIONS
        scope: RUN_AND_BUILD_TIME
        value: "true"
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${edifydb.DATABASE_URL}
      - key: DB_USE_PGBOUNCER
        scope: RUN_AND_BUILD_TIME
        value: "false"

services:
  - name: edify-planning-tool
    dockerfile_path: /Dockerfile
    source_dir: /
    github:
      branch: staging
      deploy_on_push: true
      repo: O-Mario88/edify-planning-tool
    # Match production's two-web-instance, 2 GB failure domain so shared-cache,
    # locking, SSE, duplicate-submission and capacity checks are representative.
    # A four-instance and dedicated-CPU trial is recorded in the rollout
    # evidence; neither is silently baked into this production-equivalent spec.
    instance_count: 2
    instance_size_slug: apps-s-1vcpu-2gb
    http_port: 8000
    health_check:
      http_path: /api/health/ready
      initial_delay_seconds: 60
      period_seconds: 15
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 5
    alerts:
      - rule: CPU_UTILIZATION
        disabled: false
        operator: GREATER_THAN
        value: 80
        window: TEN_MINUTES
      - rule: MEM_UTILIZATION
        disabled: false
        operator: GREATER_THAN
        value: 85
        window: TEN_MINUTES
      - rule: RESTART_COUNT
        disabled: false
        operator: GREATER_THAN
        value: 1
        window: FIVE_MINUTES
    log_destinations:
      - name: edify-staging-runtime
        open_search:
          cluster_name: edify-runtime-logs-fra
          index_name: edify-staging-runtime
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${edifyruntime.edify-web.DATABASE_URL}
      - key: DB_USE_PGBOUNCER
        scope: RUN_AND_BUILD_TIME
        value: "true"
      - key: GIT_COMMIT
        scope: RUN_TIME
        value: ${_self.COMMIT_HASH}
      # Force a fresh worker/cache namespace on every staging deployment so
      # the two-release upgrade rehearsal observes the real activation path
      # even when a backend-only candidate leaves the static manifest unchanged.
      - key: STATIC_VERSION
        scope: RUN_TIME
        value: ${_self.COMMIT_HASH}
      - key: RUN_MIGRATIONS
        scope: RUN_AND_BUILD_TIME
        value: "false"

workers:
  - name: scheduler
    dockerfile_path: /Dockerfile
    source_dir: /
    github:
      branch: staging
      deploy_on_push: true
      repo: O-Mario88/edify-planning-tool
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    run_command: python manage.py runscheduler
    alerts:
      - rule: CPU_UTILIZATION
        disabled: false
        operator: GREATER_THAN
        value: 80
        window: TEN_MINUTES
      - rule: MEM_UTILIZATION
        disabled: false
        operator: GREATER_THAN
        value: 85
        window: TEN_MINUTES
      - rule: RESTART_COUNT
        disabled: false
        operator: GREATER_THAN
        value: 1
        window: FIVE_MINUTES
    log_destinations:
      - name: edify-staging-scheduler
        open_search:
          cluster_name: edify-runtime-logs-fra
          index_name: edify-staging-scheduler
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${edifyruntime.edify-web.DATABASE_URL}
      - key: DB_USE_PGBOUNCER
        scope: RUN_AND_BUILD_TIME
        value: "true"
      - key: ENABLE_BACKGROUND_JOBS
        scope: RUN_AND_BUILD_TIME
        value: "true"
      - key: RUN_MIGRATIONS
        scope: RUN_AND_BUILD_TIME
        value: "false"

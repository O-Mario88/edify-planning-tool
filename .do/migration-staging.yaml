# DigitalOcean App Platform specification — the MIGRATION's staging, part 1
# of 2: the existing Django application, built from the migration branch.
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ A SEPARATE app on a SEPARATE database cluster. It never touches          │
# │ edify-planning-tool (production) or edify-production-db.                │
# │                                                                          │
# │   doctl apps create --spec .do/migration-staging.yaml                    │
# │                                                                          │
# │ Part 2, the Go gateway and the analytics worker, is                      │
# │ .do/migration-gateway-staging.yaml. The order and every manual step are  │
# │ in docs/migration/05-environments-and-staging.md, section 5.3.           │
# └──────────────────────────────────────────────────────────────────────────┘
#
# Why the migration branch and not `staging`: the app's pages come from
# apps.mobile_feed, and Go's saves call the group check and the pricing door;
# all three exist only on feature/edify-go-rn-migration. The branch also adds
# Django migrations (role choices), so its database must not be one `main`
# migrates. .do/staging.yaml (branch `staging`) is left as it is.
#
# Shape: production's (one web instance, no cache cluster, one scheduler), so
# what staging proves holds for production.
#
# ── Data ─────────────────────────────────────────────────────────────────────
# SEEDED, never cloned. After the first deploy, from the web component's
# console:
#
#   python manage.py stamp_environment --to staging      (type: STAMP staging)
#   python manage.py seed --demo
#
# ── Secrets you set yourself (DO console, environment editor, encrypted) ────
#   SECRET_KEY            openssl rand -hex 40, fresh, never production's
#   JWT_SECRET            openssl rand -hex 40; the gateway's EDIFY_JWT_SECRET
#                         must be the same value
#   FIELD_ENCRYPTION_KEY  openssl rand -hex 32; the gateway's
#                         EDIFY_FIELD_ENCRYPTION_KEY must be the same value
#   EDIFY_INTERNAL_KEY    openssl rand -hex 32; the gateway's EDIFY_INTERNAL_KEY
#                         must be the same value
#   SUPER_ADMIN_PASSWORD  staging only
#
# No object storage: SPACES_* are unset, so nothing on staging can reach
# production's bucket. config.settings.prod (inherited) keeps Spaces on, so an
# upload fails on staging; boot and /api/health/ready do not probe storage.
# Evidence (M8) needs a staging bucket and key of its own first.

name: edify-migration-staging-fra
region: fra

alerts:
  - rule: DEPLOYMENT_FAILED

databases:
  # Create the cluster first (DO console → Databases → PostgreSQL 16, the
  # smallest size, region fra1, name exactly this). production: true attaches
  # the existing cluster; App Platform does not create it.
  - name: db
    engine: PG
    version: "16"
    production: true
    cluster_name: edify-migration-staging-pg-fra

envs:
  - key: DJANGO_SETTINGS_MODULE
    scope: RUN_AND_BUILD_TIME
    value: config.settings.staging
  - key: DATABASE_URL
    scope: RUN_TIME
    value: ${db.DATABASE_URL}
  - key: DB_USE_PGBOUNCER
    scope: RUN_AND_BUILD_TIME
    value: "false"
  - key: DIGITALOCEAN_APP_DOMAIN
    scope: RUN_AND_BUILD_TIME
    value: ${APP_DOMAIN}
  - key: ALLOWED_HOSTS
    scope: RUN_AND_BUILD_TIME
    value: ${APP_DOMAIN}

  # The same posture as production; staging that is softer proves nothing.
  - key: AUTHZ_MODE
    scope: RUN_AND_BUILD_TIME
    value: enforce
  - key: ENABLE_MOCK_DATA
    scope: RUN_AND_BUILD_TIME
    value: "false"
  - key: ENABLE_DEV_ENDPOINTS
    scope: RUN_AND_BUILD_TIME
    value: "false"
  - key: ENABLE_DEV_SEED
    scope: RUN_AND_BUILD_TIME
    value: "false"
  - key: ENABLE_DEV_IMPORTS
    scope: RUN_AND_BUILD_TIME
    value: "false"
  - key: SECURE_SSL_REDIRECT
    scope: RUN_AND_BUILD_TIME
    value: "true"
  - key: SESSION_COOKIE_SECURE
    scope: RUN_AND_BUILD_TIME
    value: "true"
  - key: CSRF_COOKIE_SECURE
    scope: RUN_AND_BUILD_TIME
    value: "true"

  # No staging run may mail a real person.
  - key: EMAIL_PROVIDER
    scope: RUN_AND_BUILD_TIME
    value: console
  - key: SUPER_ADMIN_EMAIL
    scope: RUN_AND_BUILD_TIME
    value: edwin.omario@gmail.com

  - key: RUN_MIGRATIONS
    scope: RUN_AND_BUILD_TIME
    value: "false"
  - key: RUN_SEED
    scope: RUN_AND_BUILD_TIME
    value: "false"
  - key: ENABLE_BACKGROUND_JOBS
    scope: RUN_AND_BUILD_TIME
    value: "false"

  - key: SECRET_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: REPLACE_ME_generate_a_fresh_staging_secret_key
  - key: JWT_SECRET
    scope: RUN_TIME
    type: SECRET
    value: REPLACE_ME_generate_a_fresh_staging_jwt_secret
  - key: FIELD_ENCRYPTION_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: REPLACE_ME_generate_a_fresh_staging_field_key
  - key: EDIFY_INTERNAL_KEY
    scope: RUN_TIME
    type: SECRET
    value: REPLACE_ME_generate_a_fresh_staging_internal_key
  - key: SUPER_ADMIN_PASSWORD
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: REPLACE_ME_staging_super_admin_password

# Migrations run in a PRE_DEPLOY job, exactly as production does.
jobs:
  - name: migrate
    kind: PRE_DEPLOY
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: O-Mario88/edify-planning-tool
      branch: feature/edify-go-rn-migration
      deploy_on_push: false
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    run_command: python manage.py migrate_locked --noinput

services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: O-Mario88/edify-planning-tool
      branch: feature/edify-go-rn-migration
      deploy_on_push: false
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb-fixed
    http_port: 4000
    health_check:
      http_path: /api/health/ready
      initial_delay_seconds: 60
      period_seconds: 15
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 5
    alerts:
      - rule: RESTART_COUNT
        disabled: false
        operator: GREATER_THAN
        value: 1
        window: FIVE_MINUTES
    envs:
      - key: GIT_COMMIT
        scope: RUN_TIME
        value: ${_self.COMMIT_HASH}
      - key: RELEASE
        scope: RUN_TIME
        value: ${_self.COMMIT_HASH}
      - key: WEB_CONCURRENCY
        value: "2"

# Exactly one scheduler: it takes a database lock per job. It runs the outbox,
# so notifications Go writes to the outbox are sent (to the console here).
workers:
  - name: scheduler
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: O-Mario88/edify-planning-tool
      branch: feature/edify-go-rn-migration
      deploy_on_push: false
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    run_command: python manage.py runscheduler
    envs:
      - key: ENABLE_BACKGROUND_JOBS
        scope: RUN_AND_BUILD_TIME
        value: "true"

# DigitalOcean App Platform specification — Uganda Go Cutover Staging
# (Django-absent candidate deployment: Go gateway + Go scheduler + Next.js web
#  + standalone Python analytics worker).
#
# Guardrails preserved:
# - EDIFY_ENV=staging (production remains hard-refused in code until owner sign-off)
# - EDIFY_EXISTING_APP_URL is intentionally omitted (zero Django calls)
# - EDIFY_STRICT_READS=true (fail closed if any Go page ever attempts fallback)
# - edify_gateway least-privilege PostgreSQL role with TLS & host allowlist
# - Zero Django web/worker processes, zero manage.py build/release commands

name: edify-uganda-go-staging-fra
region: fra

alerts:
  - rule: DEPLOYMENT_FAILED

databases:
  - name: db
    engine: PG
    version: "16"
    production: true
    cluster_name: edify-migration-staging-pg-fra

services:
  - name: gateway
    dockerfile_path: platform/backend/Dockerfile
    source_dir: platform
    github:
      repo: O-Mario88/edify-planning-tool
      branch: feature/edify-go-rn-migration
      deploy_on_push: false
    instance_count: 2
    instance_size_slug: apps-s-1vcpu-1gb
    http_port: 8090
    health_check:
      http_path: /readyz
      initial_delay_seconds: 10
      period_seconds: 15
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 5
    envs:
      - key: EDIFY_ENV
        value: staging
      - key: EDIFY_HTTP_ADDR
        value: 0.0.0.0:8090
      - key: EDIFY_DB_MAX_CONNS
        value: "16"
      - key: EDIFY_STRICT_READS
        value: "true"
      - key: EDIFY_TRUST_PROXY_HEADERS
        value: "true"
      - key: EDIFY_RELEASE
        scope: RUN_TIME
        value: ${_self.COMMIT_HASH}
      - key: EDIFY_DB_ALLOWED_HOSTS
        scope: RUN_TIME
        value: ${db.HOSTNAME}
      - key: EDIFY_DB_PRODUCTION_MARKERS
        value: edify-production-db,edifyplanning.app
      - key: EDIFY_ANALYTICS_ADDR
        scope: RUN_TIME
        value: ${analytics.PRIVATE_DOMAIN}:50061
      - key: EDIFY_PUBLIC_BASE_URL
        scope: RUN_TIME
        value: ${APP_URL}
      - key: EDIFY_GO_SAVES
        value: schedule_visit,reschedule_visit,cancel_visit,edit_visit,schedule_training_pair,group_reschedule,group_cancel,schedule_group_training,schedule_cluster_meeting,complete_visit,pl_review
      - key: EDIFY_DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_edify_gateway_connection_url
      - key: EDIFY_JWT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_staging_jwt_secret
      - key: EDIFY_FIELD_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_staging_field_encryption_key

  - name: web
    dockerfile_path: platform/web/Dockerfile
    source_dir: platform/web
    github:
      repo: O-Mario88/edify-planning-tool
      branch: feature/edify-go-rn-migration
      deploy_on_push: false
    instance_count: 2
    instance_size_slug: apps-s-1vcpu-1gb
    http_port: 3000
    health_check:
      http_path: /login
      initial_delay_seconds: 15
      period_seconds: 20
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 5
    envs:
      - key: EDIFY_ENV
        value: staging
      - key: EDIFY_GATEWAY_URL
        scope: RUN_TIME
        value: http://${gateway.PRIVATE_DOMAIN}:8090

  # Standalone Python analytics service (gRPC only, zero Django, refuses DB env).
  - name: analytics
    dockerfile_path: platform/workers/analytics/Dockerfile
    source_dir: platform
    github:
      repo: O-Mario88/edify-planning-tool
      branch: feature/edify-go-rn-migration
      deploy_on_push: false
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    internal_ports:
      - 50061
    envs:
      - key: EDIFY_ANALYTICS_ADDR
        value: 0.0.0.0:50061

workers:
  # Standalone Go scheduler replacing Django runscheduler.py (41 jobs + cluster follow-up).
  # Uses PostgreSQL session advisory locks (PGLocker) so multiple replicas never overlap.
  - name: scheduler
    dockerfile_path: platform/backend/Dockerfile
    source_dir: platform
    run_command: /scheduler
    github:
      repo: O-Mario88/edify-planning-tool
      branch: feature/edify-go-rn-migration
      deploy_on_push: false
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: EDIFY_ENV
        value: staging
      - key: EDIFY_RELEASE
        scope: RUN_TIME
        value: ${_self.COMMIT_HASH}
      - key: EDIFY_DB_ALLOWED_HOSTS
        scope: RUN_TIME
        value: ${db.HOSTNAME}
      - key: EDIFY_DB_PRODUCTION_MARKERS
        value: edify-production-db,edifyplanning.app
      - key: EDIFY_DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_edify_gateway_connection_url
      - key: EDIFY_JWT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_staging_jwt_secret
      - key: EDIFY_FIELD_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_staging_field_encryption_key

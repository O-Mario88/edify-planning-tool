syntax = "proto3";

package edify.activities.v1;

// Activities, saved by Go one save at a time (owner, 2026-11-12: "Yes, one
// at a time"; docs/migration/03 §3.7, 27 §27.5). Until a save moves, the
// existing application makes it; a save is never made by both.
//
// The first save is scheduling a school visit (docs/migration/27): the
// existing Schedule drawer of the Planning page
// (/planning/schedule-modal?school_id=… posting to
// /planning/schedule-action), for exactly 27.3's case — a staff-delivered
// visit for one of six purposes, planned by its owner at a school in their
// own portfolio, with no project, priority allocation, source activity or
// partner. Everything else is handed on to the existing application
// unchanged.
service ActivityService {
  // Schedule one school visit as the caller. The answer is the new
  // activity, or the existing application's own words for why it was
  // refused. A refusal leaves nothing written.
  rpc ScheduleSchoolVisit(ScheduleSchoolVisitRequest) returns (ScheduleSchoolVisitResponse);

  // Move one scheduled school visit to another day as the caller: the
  // second save (docs/migration/29), from My Plan's Reschedule drawer
  // (/my-plan/{id}/reschedule-drawer posting to /my-plan/{id}/reschedule),
  // for exactly 29.1's case — a visit of the first save's kind, still only a
  // plan, moved by its owner. The answer is the moved activity, or the
  // existing application's own words for why it was refused. A refusal
  // leaves nothing written.
  rpc RescheduleSchoolVisit(RescheduleSchoolVisitRequest) returns (RescheduleSchoolVisitResponse);

  // Call off one scheduled school visit as the caller: the third save
  // (docs/migration/30), from My Plan's Cancel drawer
  // (/my-plan/{id}/cancel-drawer posting to /my-plan/{id}/cancel), for
  // exactly 30.1's case — a visit of the first save's kind, still only a
  // plan, called off by its owner. The answer is the cancelled activity, or
  // the existing application's own words for why it was refused. A refusal
  // changes nothing but the refusal's own audit row, as today.
  rpc CancelSchoolVisit(CancelSchoolVisitRequest) returns (CancelSchoolVisitResponse);

  // Change what one scheduled school visit is for, as the caller: the fourth
  // save (docs/migration/31), from My Plan's Edit drawer
  // (/my-plan/{id}/edit-drawer posting to /my-plan/{id}/edit), for exactly
  // 31.1's case — a visit of the first save's kind, still only a plan,
  // edited by its owner, its goal and expected outcome changed and its day,
  // school, purpose and focus left as they are. The answer is the edited
  // activity, or the existing application's own words for why it was
  // refused. A refusal changes nothing but the refusal's own audit row, as
  // today.
  rpc EditSchoolVisit(EditSchoolVisitRequest) returns (EditSchoolVisitResponse);
}

// The drawer's own fields, named as it posts them.
message ScheduleSchoolVisitRequest {
  // The school: its record id or its school code (the drawer posts either;
  // the existing view resolves both).
  string school_id = 1;
  // purpose_of_visit: one of "training_follow_up", "ssa_support",
  // "donor_visit", "story_gathering", "school_invitation", "social_visit".
  string purpose_of_visit = 2;
  // scheduled_date: the planned day, "YYYY-MM-DD".
  string scheduled_date = 3;
  // activity_goal (or activity_purpose_text, which the drawer posts): the
  // purpose in the planner's words. May be empty.
  string activity_goal = 4;
  // expected_outcome. May be empty.
  string expected_outcome = 5;
  // ssa_deviation_reason: why the plan departs from the school's SSA, when
  // it does. May be empty; kept to 2,000 characters as the existing save
  // keeps it.
  string ssa_deviation_reason = 6;
  // catalogue_item_id: the item the drawer pinned, if any. Empty: the item
  // is resolved from the purpose, as the drawer's require_catalogue=yes asks.
  string catalogue_item_id = 7;
  // recommendation_reason: the reason the drawer carries for the item it
  // pinned. Cleared when the pinned item is replaced by the purpose's own.
  string recommendation_reason = 8;
}

// What the save did. Exactly one of activity or refused is set.
message ScheduleSchoolVisitResponse {
  ScheduledActivity activity = 1;
  // The existing application's words for a refused save, e.g.
  // "1 October 2026 has passed. Schedule work from 12 November 2026
  // onwards." Nothing was written.
  string refused = 2;
}

// The activity a save made, and the confirmation the web shows for it.
message ScheduledActivity {
  // activity.id.
  string id = 1;
  // activity.status: "scheduled".
  string status = 2;
  // activity.activity_type, e.g. "school_visit_ssa_collection".
  string activity_type = 3;
  // activity.planned_date, "YYYY-MM-DD".
  string planned_date = 4;
  // activity.fy, e.g. "2027".
  string fy = 5;
  // "School visit scheduled. It is on your My Plan — keep planning."
  string message = 6;
  // A warning the save raised without being refused: the planner is past
  // the visits their role plans in a year. Empty when there is none.
  string notice = 7;
  // Where the work can be seen, "/my-plan?fy=2027&month=11&period=month",
  // and its label, "Open My Plan".
  string plan_url = 8;
  string plan_link_label = 9;
}

// The Reschedule drawer's own fields, named as it posts them.
message RescheduleSchoolVisitRequest {
  // activity.id: the visit being moved.
  string activity_id = 1;
  // scheduled_date: the new day, "YYYY-MM-DD".
  string scheduled_date = 2;
  // reason: why the date is changing. The drawer asks for it; the existing
  // save refuses a short day without one.
  string reason = 3;
}

// What the move did. Exactly one of activity or refused is set.
message RescheduleSchoolVisitResponse {
  RescheduledActivity activity = 1;
  // The existing application's words for a refused move, e.g.
  // "This date's visits have already left draft status. Choose another
  // date." Nothing was written.
  string refused = 2;
}

// The activity a move left, and the confirmation the web shows for it.
message RescheduledActivity {
  // activity.id.
  string id = 1;
  // activity.status: "rescheduled".
  string status = 2;
  // activity.planned_date, "YYYY-MM-DD".
  string planned_date = 3;
  // activity.fy, e.g. "2027".
  string fy = 4;
  // activity.reschedule_count after the move.
  int32 reschedule_count = 5;
  // "Saved. Press Refresh to see it on the page."
  string message = 6;
}

// The Cancel drawer's fields, named as it posts them.
message CancelSchoolVisitRequest {
  // activity.id: the visit being called off.
  string activity_id = 1;
  // reason: why it is called off. Required: the existing save refuses a
  // blank one ("Give a reason this activity is being cancelled.").
  string reason = 2;
}

// What the cancel did. Exactly one of activity or refused is set.
message CancelSchoolVisitResponse {
  CancelledActivity activity = 1;
  // The existing application's words for a refused cancel, e.g. "Give a
  // reason this activity is being cancelled."
  string refused = 2;
}

// The activity a cancel left, and the confirmation the web shows for it.
message CancelledActivity {
  // activity.id.
  string id = 1;
  // activity.status: "cancelled".
  string status = 2;
  // activity.last_reason: the reason given.
  string reason = 3;
  // "Saved. Press Refresh to see it on the page."
  string message = 4;
}

// The Edit drawer's fields for a visit, named as it posts them. A field the
// drawer did not post is left unset: the existing save changes only what is
// posted, and its audit row names the fields that were.
message EditSchoolVisitRequest {
  // activity.id: the visit being edited.
  string activity_id = 1;
  // scheduled_date: the day the drawer shows (YYYY-MM-DD). Another day is a
  // move (the second save's rules), handed on unless refused.
  optional string scheduled_date = 2;
  // purpose_type: the purpose the drawer shows. Another purpose is handed on
  // unless refused.
  optional string purpose_type = 3;
  // school_id: the school's code as the drawer lists it. Another school is
  // handed on.
  optional string school_id = 4;
  // focus_intervention: the SSA intervention the drawer shows. Another one is
  // handed on.
  optional string focus_intervention = 5;
  // activity_purpose_text: the goal.
  optional string activity_purpose_text = 6;
  // expected_outcome: what the visit should leave behind.
  optional string expected_outcome = 7;
  // purpose_training_course_id: the training an In-school Training names;
  // posted blank for the six purposes. A named one is handed on.
  optional string purpose_training_course_id = 8;
  // reason: why the day, school or purpose is changing; blank otherwise.
  string reason = 9;
}

// What the edit did. Exactly one of activity or refused is set.
message EditSchoolVisitResponse {
  EditedActivity activity = 1;
  // The existing application's words for a refused edit, e.g. "Give the
  // reason the date is changing."
  string refused = 2;
}

// The activity an edit left, and the confirmation the web shows for it.
message EditedActivity {
  // activity.id.
  string id = 1;
  // activity.status: unchanged, "scheduled" or "rescheduled".
  string status = 2;
  // activity.activity_purpose_text: the goal now.
  string activity_purpose_text = 3;
  // activity.expected_outcome: the expected outcome now.
  string expected_outcome = 4;
  // "Saved. Press Refresh to see it on the page."
  string message = 5;
}

syntax = "proto3";

package edify.screens.v1;

import "edify/screens/v1/form.proto";

// A web page read as its shared components (apps.mobile_feed.page_blocks):
// the page header, its tabs, and the blocks under them in the order the page
// draws them. Every label, figure and line is the page's own text. An href is
// the web path the element links to; the app opens what it draws natively and
// the web for the rest.

message PageBadge {
  string text = 1;
  // good, caution, alert, info or plain.
  string tone = 2;
  // The hover text, e.g. "Source: Recorded · Confirmed".
  string title = 3;
  // The small drawing before the words, by name: "lock" (a school's support
  // visit for the year is taken), "unlock" (it is still open). Empty for a
  // badge of words only.
  string icon = 4;
}

message PageAction {
  string key = 1;
  string label = 2;
  // The page's one primary button.
  bool primary = 3;
  bool enabled = 4;
  // Why a disabled button cannot be used, as the page says it.
  string reason = 5;
  // The web path the button opens (its drawer).
  string href = 6;
  // Opens as a drawer (the web fetches it into its drawer).
  bool drawer = 7;
  // Downloads a file (an export) instead of opening a page: the web sends
  // the reader to href, the app hands it to the system.
  bool download = 8;
}

message PageHeader {
  string back_label = 1;
  string back_href = 2;
  string title = 3;
  // The line under the title, e.g. "School ID: 1286".
  string description = 4;
  repeated PageBadge badges = 5;
  repeated PageAction actions = 6;
  // The small line over the title ("My Work").
  string eyebrow = 7;
}

message PageTab {
  // The page's own value of its tab parameter, e.g. "overview".
  string key = 1;
  string label = 2;
  bool active = 3;
}

message PageFact {
  string label = 1;
  string value = 2;
  string href = 3;
  // The colour the value is drawn in: good, caution, alert, or '' for plain.
  string tone = 4;
}

message PageFacts {
  repeated PageFact facts = 1;
}

message PageFilterOption {
  string value = 1;
  string label = 2;
}

message PageFilter {
  // The query parameter the filter sets, e.g. "fy".
  string name = 1;
  string label = 2;
  string value = 3;
  repeated PageFilterOption options = 4;
  // The short word the page draws beside the select ("FY" for "Fiscal
  // year"), when it differs from the name.
  string caption = 5;
  // The page folds it under its own "More filters" (the Clusters page
  // authors the last three there), whatever the width.
  bool more = 6;
}

message PageFilters {
  repeated PageFilter filters = 1;
  // The hidden values the filter form sends with every change (My Plan's
  // previous year and quarter).
  map<string, string> hidden = 2;
}

message PageMetric {
  string label = 1;
  // The figure as the tile shows it ("872", "UGX 1.3M", "0%").
  string value = 2;
  // The short line under the figure, when there is one.
  string helper = 3;
  // The fuller sentence the tile keeps for a screen reader.
  string note = 4;
  string href = 5;
  string tone = 6;
}

message PageStrip {
  string title = 1;
  repeated PageMetric metrics = 2;
  // The line under the title ("All activity types combined").
  string subtitle = 3;
}

message PageColumn {
  string label = 1;
  // Right-aligned figures.
  bool numeric = 2;
}

message PageCell {
  string text = 1;
  string href = 2;
  // success, danger, warning, info, lime or empty; for a badge, the
  // badge's colour (green, blue, amber, purple, rose, slate, primary …).
  string tone = 3;
  bool strong = 4;
  // Drawn as one pill.
  bool badge = 5;
  // The row's own buttons and its Actions menu, in order. A button's key is
  // "button", a menu item's "menu", a red menu item's "danger".
  repeated PageAction actions = 6;
  // The chips the cell draws side by side (a school's Visit and Training
  // plan statuses, its Visit Lock), each in its own colour; the cell's text
  // is still their words run together. A chip's tone is the page's own
  // planning tone: none (red, Not Planned), planned (orange), awaiting
  // (blue), verified (green), replan (amber), closed (grey, a held visit) or
  // open (outlined, an unlocked one); its icon "lock" or "unlock"; its title
  // the sentence the page shows on hover.
  repeated PageBadge pills = 7;
}

message PageRow {
  repeated PageCell cells = 1;
  // done (green), overdue (red), dayoff (on a holiday or leave day) or empty.
  string tone = 2;
  // The activity the row's tick box ticks for the Reschedule / Cancel bar,
  // and what the tick box says; empty when the row cannot be ticked.
  string pick_id = 3;
  string pick_label = 4;
  // What opening the row shows under it (the school's details), and the
  // link to the record's own page there.
  repeated PageFact details = 5;
  string details_href = 6;
  // What else the open row shows (the school's SSA scores).
  repeated PageBlock detail_blocks = 7;
}

message PagePagerPage {
  // "1", "2", "…", "Prev" or "Next".
  string label = 1;
  // The page's query ("?school_visits_page=2"); empty for the current page.
  string href = 2;
  bool current = 3;
}

// The shared table pager, when a table has more than one page.
message PagePager {
  // "Showing 1–50 of 51".
  string summary = 1;
  repeated PagePagerPage pages = 2;
  // The rows-a-page chooser beside the pages ("15 / page"), when there is one.
  PageFilter size = 3;
}

message PageTable {
  string title = 1;
  // The line beside the title, e.g. "FY 2025/26 to FY 2026/27".
  string subtitle = 2;
  repeated PageColumn columns = 3;
  repeated PageRow rows = 4;
  // The note under the table.
  string footnote = 5;
  // Shown in place of rows when the table is empty.
  string empty_message = 6;
  // The count beside the title.
  string count = 7;
  // The empty state's way out ("Open Planning").
  PageAction empty_action = 8;
  PagePager pager = 9;
  // The existing card the table is drawn in ("admin-panel": the Admin
  // dashboard's cards); empty for the shared table card.
  string family = 10;
  // That card's and that table's own class names, as the existing page
  // writes them ("admin-panel admin-priorities", "admin-table
  // admin-table--priorities"), so its stylesheet draws them.
  string card_class = 11;
  string table_class = 12;
  // The link at the card's head ("View Calendar") and at its foot ("View all
  // priorities (6)").
  PageLink header_link = 13;
  PageLink footer_link = 14;
}

message PageLinkTab {
  string label = 1;
  // The page's query this tab opens ("?period=week").
  string href = 2;
  bool active = 3;
}

// Tabs that are links (My Plan's This Week … This FY), with the link drawn
// beside them (Open Calendar).
message PageLinkTabs {
  repeated PageLinkTab tabs = 1;
  PageAction beside = 2;
  // The strip's name, before its links ("Leave").
  string label = 3;
  // A workspace's sibling pages: every link in a strip that scrolls
  // sideways, rather than the rest under More.
  bool scrolls = 4;
}

message PageMeter {
  string label = 1;
  string value = 2;
  // How full the bar is, 0 to 1.
  double fraction = 3;
  string href = 4;
}

message PageLink {
  string text = 1;
  string href = 2;
  // A second line under the link (a date, a status).
  string caption = 3;
  // Opens as a drawer.
  bool drawer = 4;
}

message PageRailPart {
  string key = 1;
  string title = 2;
  string figure = 3;
  string figure_href = 4;
  string figure_note = 5;
  repeated PageMeter meters = 6;
  string note = 7;
  repeated PageLink links = 8;
}

message PageRail {
  string title = 1;
  string subtitle = 2;
  repeated PageRailPart parts = 3;
}

message PageSeries {
  string name = 1;
  repeated double values = 2;
}

// A bar chart (components/data_chart.html), from the data the page charts.
message PageChart {
  string title = 1;
  string subtitle = 2;
  bool horizontal = 3;
  repeated string categories = 4;
  repeated PageSeries series = 5;
  double min = 6;
  double max = 7;
  string axis_title = 8;
}

message PageDataRow {
  string label = 1;
  // The second line under the label.
  string meta = 2;
  string value = 3;
  string tone = 4;
}

message PageDataRows {
  repeated PageDataRow rows = 1;
}

message PageLinks {
  repeated PageLink links = 1;
}

// One part of a panel, in the order the panel draws them.
message PagePanelItem {
  oneof kind {
    // A sub-heading inside the panel.
    string heading = 1;
    // A paragraph.
    string text = 2;
    PageFacts fields = 3;
    PageDataRows rows = 4;
    PageLinks links = 5;
    PageMeter meter = 6;
  }
  // The tone of a text item's own status words.
  string tone = 7;
  // The bold words a text item opens with ("Your FY2027 visits: 7 of 560
  // planned."), the start of its text.
  string lead = 8;
  // The links inside a text item's sentence, each at the words it carries
  // ("School Directory" in "Every school is still in the School Directory").
  repeated PageLink text_links = 9;
}

// A titled card of record details (the Details tab's panels, SSA history).
message PagePanel {
  string title = 1;
  string subtitle = 2;
  repeated PageBadge badges = 3;
  repeated PagePanelItem items = 4;
}

// A switch between parts drawn on the page itself (Participation's Planned
// and Completed).
message PageSegment {
  string label = 1;
  bool active = 2;
  repeated PageBlock blocks = 3;
  // The count in the switch's pill, e.g. "0".
  string count = 4;
}

message PageSegments {
  repeated PageSegment segments = 1;
  string title = 2;
  // The line beside the title, e.g. "0 planned · 0 completed".
  string subtitle = 3;
  // The sentence under the switch.
  string caption = 4;
}

// One record in a card of rows: a task, an activity, a request.
message PageListItem {
  string title = 1;
  // The lines under the title ("Nakisunga Hill Primary · partner").
  repeated string lines = 2;
  repeated PageBadge badges = 3;
  // The row's buttons and links ("Open").
  repeated PageAction actions = 4;
  // Where the whole row leads, when it is a link.
  string href = 5;
  // The colour of its icon square: info, good, caution, alert, brand.
  string tone = 6;
  // An entry that opens onto its records (identical To-Dos as one).
  repeated PageListItem children = 7;
  string count = 8;
  // What the row is filtered on by the page's chips (cat → "Finance").
  map<string, string> keys = 9;
  // A bar beside the row (the Admin dashboard's sign-ins a day).
  PageMeter meter = 10;
}

message PageChip {
  string value = 1;
  string label = 2;
  string count = 3;
}

// Buttons that filter the page's rows on the device (To-Do's categories).
message PageChips {
  // The filter's name, as the rows' keys name it ("cat").
  string name = 1;
  string label = 2;
  // The value the page opens on ("all").
  string value = 3;
  repeated PageChip chips = 4;
}

// A card of rows, optionally titled with a count ("Do next  45 open").
message PageList {
  string title = 1;
  string count = 2;
  string subtitle = 3;
  repeated PageListItem items = 4;
  // The existing component the list is drawn as ("admin-panel": a card of
  // rows, the Admin dashboard's); empty for the plain list.
  string family = 5;
  // What the card says when it has no rows.
  string empty = 6;
}

message PageBlock {
  oneof kind {
    // "Single school, FY 2026/27": what the profile covers.
    string scope_line = 1;
    PageFacts facts = 2;
    PageFilters filters = 3;
    PageStrip strip = 4;
    PageTable table = 5;
    PageRail rail = 6;
    PageChart chart = 7;
    PagePanel panel = 8;
    PageSegments segments = 9;
    // An empty state's message ("No record yet: the figure is 0.").
    string empty = 10;
    PageLinkTabs link_tabs = 11;
    PageList list = 12;
    PageChips chips = 13;
    PageRecord record = 14;
    // A list's own pager, outside a table card (Clusters, Planning).
    PagePager pager = 15;
    PageForm form = 16;
    // A heading between a page's sections ("Program Growth"), drawn as a
    // section title rather than as a card of its own.
    string section = 17;
    // A month calendar (the Calendar page), beside the event-type tabs that
    // draw it as text.
    PageCalendar calendar = 18;
  }
  // The existing layout the block sits in with the blocks beside it that
  // name the same group ("admin-ops-grid": the Admin dashboard's cards side
  // by side); empty for a block on its own.
  string group = 19;
}

// One entry of a calendar day: a piece of work, a leave day, a holiday or an
// organization event, as the page's chip draws it.
message PageCalendarEvent {
  // "activity", "leave", "holiday" or "event": the event-type tab it is
  // counted under (PageCalendar.kinds).
  string kind = 1;
  // An activity's colour family on the grid and legend ("visit",
  // "training", "cluster", "core", "project", "programme", "activity");
  // '' for the other kinds.
  string family = 2;
  string title = 3;
  // The line under the title: the place, the run's dates or "Day 2 of 3",
  // the reason to reschedule, a leave's type, a holiday's kind.
  string meta = 4;
  // What it opens, or ''.
  string href = 5;
  // What its tick box ticks for the page's bar (PageSelection), or '' for
  // none. Every day of a multi-day activity carries the same one.
  string pick_id = 6;
  // A later day of an entry that runs over several days: it carries on the
  // previous day's chip.
  bool continued = 7;
  // Work planned on a public holiday or its owner's leave: to reschedule.
  bool day_off = 8;
}

// One day of the month that has entries.
message PageCalendarDay {
  // The day, "2026-11-26".
  string date = 1;
  bool today = 2;
  // Any of its entries is to be rescheduled.
  bool day_off = 3;
  // In the page's order: events, holidays, leave, work, each by title.
  repeated PageCalendarEvent events = 4;
}

message PageCalendar {
  int32 year = 1;
  int32 month = 2;
  // Today ("2026-11-13") when it falls in this month, else ''.
  string today = 3;
  // The event-type tabs: each one's key ("all", "activity", "leave",
  // "holiday", "event"), label and count.
  repeated PageChip kinds = 4;
  // The tab the page opens on (?event_kind=), "all" for every kind.
  string kind = 5;
  // The days of the month with entries, in order.
  repeated PageCalendarDay days = 6;
}

// One part of a form on a page, in the order the form draws them.
message PageFormItem {
  oneof kind {
    DrawerNote note = 1;
    string heading = 2;
    string text = 3;
    DrawerField field = 4;
  }
  // Shown only while any condition holds; empty for always.
  repeated DrawerCondition show_when = 5;
}

// A form the page shows itself (Escalations' "Escalate to …"), saved through
// PageDrawerService.SaveDrawer with the page's path and this form's key.
message PageForm {
  string title = 1;
  // The line under the title.
  string text = 2;
  repeated PageFormItem items = 3;
  string submit_label = 4;
  // Names this form among the page's forms when it is saved.
  string key = 5;
  // The app saves it; otherwise the form is finished on the web.
  bool can_save = 6;
}

// A record card that opens in place (a cluster, a school, a project): its
// name, pills, Actions menu and facts, and what opening it shows.
message PageRecord {
  string title = 1;
  // The record's own page (its profile), or ''.
  string href = 2;
  string subtitle = 3;
  repeated PageBadge badges = 4;
  repeated PageAction actions = 5;
  repeated PageFact facts = 6;
  // What the open card shows, read with the card.
  repeated PageBlock details = 7;
  // The list the card loads once opened (its schools), as a page path.
  string details_path = 8;
  // What the card's tick box ticks for the page's bar (PageSelection), and
  // what it says ("Select Nakifuma UMEA Primary School"); '' for none.
  string pick_id = 9;
  string pick_label = 10;
}

// A dialog a page opens itself (My Targets' Submit MSCS), opened by a link
// to "#dialog=<key>".
message PageDialog {
  string key = 1;
  string title = 2;
  repeated PageBlock blocks = 3;
}

// What the page's bar for ticked rows does: each of its buttons opens a
// drawer with the ticked rows (PageRow.pick_id).
message PageSelectionAction {
  string label = 1;
  // The drawer it opens, e.g. "/activity-selection/reschedule".
  string href = 2;
  // The parameter the ticks are sent in ("ids", "school_ids").
  string param = 3;
  // All ticks in one comma-joined value; otherwise the parameter repeats.
  bool joined = 4;
}

message PageSelection {
  // What the bar calls the ticks: "activities selected".
  string noun = 1;
  repeated PageSelectionAction actions = 2;
}

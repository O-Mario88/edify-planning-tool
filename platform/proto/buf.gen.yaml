# Reproducible generation. Every plugin is pinned: the Go ones through
# ../tools/go.mod (`make tools` builds them into ../.bin), the TypeScript one through
# ../mobile/package-lock.json. Python stubs are generated by
# ../workers/analytics/scripts/gen_proto.sh with the pinned grpcio-tools.
# Run `make proto` from platform/; CI fails when the output differs.
version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/O-Mario88/edify-planning-tool/platform/backend/gen
plugins:
  - local: ../.bin/protoc-gen-go
    out: ../backend/gen
    opt: paths=source_relative
  - local: ../.bin/protoc-gen-connect-go
    out: ../backend/gen
    opt: paths=source_relative
  - local: ../.bin/protoc-gen-go-grpc
    out: ../backend/gen
    opt: paths=source_relative
  - local: ../mobile/node_modules/.bin/protoc-gen-es
    out: ../mobile/src/gen
    opt: target=ts
    include_imports: true

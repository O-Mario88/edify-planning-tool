{% comment %}The execution columns (owner design, 2026-09-28).{% endcomment %}
<th scope="col" title="Activities whose approved scheduled date falls in the period">Due</th>
<th scope="col" title="Execution started (or delivered)">Started</th>
<th scope="col" title="Implementer submitted: actual data and evidence in, sent for review">Execution Completed</th>
<th scope="col" title="Verified: by the Programme Lead for a CCEO's staff work, by IA for Partner and a Lead's own work">IA Verified</th>
<th scope="col" title="Closed through the governed closure: programme and finance conditions complete">Fully Closed</th>
<th scope="col" title="Started on or before the approved scheduled date, of the work due">On-Time %</th>
<th scope="col" title="Past the scheduled date and not yet verified, at any stage">Overdue</th>
<th scope="col" title="Due in the period when it began, since moved to a later date (recorded from the schedule trail)">Carried Forward</th>
<th scope="col" title="Returned for correction and not yet resubmitted">Returned</th>
<th scope="col" title="Required visit and training slots not yet verified">Remaining Slots</th>
<th scope="col" title="Decision support: projected share verified by the period's end">Forecast</th>
<th scope="col" title="Open Director-to-Lead execution follow-ups">Open Reminders</th>

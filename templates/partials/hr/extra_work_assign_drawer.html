{% extends "components/drawers/base_drawer.html" %}

{% block drawer_title %}Assign extra work{% endblock %}
{% block drawer_subtitle %}{% endblock %}

{% block drawer_body %}
<form method="post" action="/extra-work/assign"
      hx-post="/extra-work/assign" hx-target="#extra-work-errors"
      hx-disabled-elt="find button[type=submit]"
      class="space-y-4 text-[12px] text-slate-600">
  {% csrf_token %}
  <div id="extra-work-errors" aria-live="polite"></div>

  <p class="edify-text-caption text-slate-500">Verified independently and counted separately; it never changes a distributed target.</p>

  <div class="space-y-1">
    <label for="xw-assignee" class="block edify-text-caption font-semibold text-slate-600">Assign to <span class="text-rose-500">*</span></label>
    <select id="xw-assignee" name="assignee_id" required class="h-11 w-full rounded-control border border-[var(--border-card)] px-3 text-[14px] focus:border-[var(--edify-accent)] focus:ring-4 edify-primary-focus">
      <option value="">Choose a staff member…</option>
      {% for u in assignees %}<option value="{{ u.id }}">{{ u.name }} — {{ u.active_role }}</option>{% endfor %}
    </select>
  </div>

  <div class="space-y-1">
    <label for="xw-due" class="block edify-text-caption font-semibold text-slate-600">Due date <span class="text-rose-500">*</span></label>
    <input id="xw-due" name="due_date" type="date" required class="h-11 w-full rounded-control border border-[var(--border-card)] px-3 text-[16px] focus:border-[var(--edify-accent)] focus:ring-4 edify-primary-focus">
  </div>

  <div class="space-y-1">
    <label for="xw-title" class="block edify-text-caption font-semibold text-slate-600">Title <span class="text-rose-500">*</span></label>
    <input id="xw-title" name="title" type="text" maxlength="200" required placeholder="What is being asked, in one line"
           class="h-11 w-full rounded-control border border-[var(--border-card)] px-3 text-[14px] focus:border-[var(--edify-accent)] focus:ring-4 edify-primary-focus">
  </div>

  <div class="space-y-1">
    <label for="xw-instruction" class="block edify-text-caption font-semibold text-slate-600">Detailed instruction <span class="text-rose-500">*</span></label>
    <textarea id="xw-instruction" name="instruction" rows="3" required placeholder="What to deliver and how it is judged"
              class="w-full rounded-control border border-[var(--border-card)] px-3 py-2 text-[14px] focus:border-[var(--edify-accent)] focus:ring-4 edify-primary-focus"></textarea>
  </div>

  <div class="space-y-1">
    <label for="xw-category" class="block edify-text-caption font-semibold text-slate-600">Category <span class="text-rose-500">*</span></label>
    <select id="xw-category" name="category" required class="h-11 w-full rounded-control border border-[var(--border-card)] px-3 text-[13px] focus:border-[var(--edify-accent)] focus:ring-4 edify-primary-focus">
      {% for value, label in categories %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
    </select>
  </div>

  <div class="space-y-1">
    <label for="xw-complexity" class="block edify-text-caption font-semibold text-slate-600">Complexity</label>
    <select id="xw-complexity" name="complexity" class="h-11 w-full rounded-control border border-[var(--border-card)] px-3 text-[13px] focus:border-[var(--edify-accent)] focus:ring-4 edify-primary-focus">
      <option value="low">Low</option>
      <option value="medium" selected>Medium</option>
      <option value="high">High</option>
    </select>
  </div>

  <div class="space-y-1">
    <label for="xw-urgency" class="block edify-text-caption font-semibold text-slate-600">Urgency</label>
    <select id="xw-urgency" name="urgency" class="h-11 w-full rounded-control border border-[var(--border-card)] px-3 text-[13px] focus:border-[var(--edify-accent)] focus:ring-4 edify-primary-focus">
      <option value="normal" selected>Normal</option>
      <option value="high">High</option>
      <option value="urgent">Urgent</option>
    </select>
  </div>

  <div class="space-y-1">
    <label for="xw-milestone" class="block edify-text-caption font-semibold text-slate-600">Linked priority milestone <span class="font-normal text-slate-400">(optional)</span></label>
    <select id="xw-milestone" name="linked_milestone_id" class="h-11 w-full rounded-control border border-[var(--border-card)] px-3 text-[13px] focus:border-[var(--edify-accent)] focus:ring-4 edify-primary-focus">
      <option value="">None</option>
      {% for m in milestones %}<option value="{{ m.id }}">{{ m.title|truncatechars:70 }}</option>{% endfor %}
    </select>
  </div>

  <div class="space-y-1">
    <label for="xw-output" class="block edify-text-caption font-semibold text-slate-600">Expected output <span class="font-normal text-slate-400">(optional)</span></label>
    <input id="xw-output" name="expected_output" type="text" maxlength="255" placeholder="e.g. One report, 3 sessions"
           class="h-11 w-full rounded-control border border-[var(--border-card)] px-3 text-[14px] focus:border-[var(--edify-accent)] focus:ring-4 edify-primary-focus">
  </div>

  <label for="xw-evidence-required" class="flex items-center gap-2 cursor-pointer">
    <input id="xw-evidence-required" type="checkbox" name="evidence_required" checked class="h-4 w-4 rounded border-slate-300 edify-primary-text edify-primary-focus">
    <span class="text-[13px] font-medium text-slate-600">Evidence required at submission</span>
  </label>

  <div class="space-y-1">
    <label for="xw-reason" class="block edify-text-caption font-semibold text-slate-600">Business reason <span class="font-normal text-slate-400">(optional)</span></label>
    <textarea id="xw-reason" name="reason" rows="2" class="w-full rounded-control border border-[var(--border-card)] px-3 py-2 text-[14px] focus:border-[var(--edify-accent)] focus:ring-4 edify-primary-focus"></textarea>
  </div>

  <div class="drawer-footer">
    <button type="button" @click="requestClose()" class="btn btn-secondary h-8">Cancel</button>
    <button type="submit" class="btn btn-primary h-8">Assign work</button>
  </div>
</form>
{% endblock %}

<label class="block edify-text-caption uppercase tracking-wider text-slate-400 mb-1">Planned Date <span class="text-rose-500">*</span></label>
<div
x-data="{
open: false,
selectedDate: '{{ default_date|default:"" }}',
currentYear: new Date().getFullYear(),
currentMonth: new Date().getMonth(),
months: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'],
days: [],
init() {
if (this.selectedDate) {
let d = new Date(this.selectedDate);
if (!isNaN(d.getTime())) {
this.currentYear = d.getFullYear();
this.currentMonth = d.getMonth();
}
}
this.getDays();
},
getDays() {
let firstDay = new Date(this.currentYear, this.currentMonth, 1).getDay();
let lastDate = new Date(this.currentYear, this.currentMonth + 1, 0).getDate();
this.days = [];
for (let i = 0; i < firstDay; i++) {
this.days.push(null);
}
for (let d = 1; d <= lastDate; d++) {
this.days.push(d);
}
},
prevMonth() {
if (this.currentMonth === 0) {
this.currentMonth = 11;
this.currentYear--;
} else {
this.currentMonth--;
}
this.getDays();
},
nextMonth() {
if (this.currentMonth === 11) {
this.currentMonth = 0;
this.currentYear++;
} else {
this.currentMonth++;
}
this.getDays();
},
selectDay(day) {
if (day === null) return;
let monthStr = String(this.currentMonth + 1).padStart(2, '0');
let dayStr = String(day).padStart(2, '0');
this.selectedDate = `${this.currentYear}-${monthStr}-${dayStr}`;
this.open = false;
},
formatDate(dateStr) {
if (!dateStr) return 'Select Date';
let parts = dateStr.split('-');
if (parts.length !== 3) return dateStr;
let d = new Date(parts[0], parts[1] - 1, parts[2]);
return d.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });
},
isSelected(day) {
if (!day || !this.selectedDate) return false;
let parts = this.selectedDate.split('-');
return parseInt(parts[0]) === this.currentYear &&
(parseInt(parts[1]) - 1) === this.currentMonth &&
parseInt(parts[2]) === day;
}
}"
class="relative"
@keydown.escape.stop="open = false"
>
<button
type="button"
@click="open = !open"
class="w-full h-10 px-3 flex items-center justify-between rounded-control border border-slate-200 text-[12px] font-semibold edify-surface focus:outline-none transition-colors text-slate-700"
aria-label="Choose planned date"
:aria-expanded="open.toString()"
aria-controls="cluster-planned-date-calendar"
>
<span class="flex items-center gap-2">
<svg class="h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
<path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
</svg>
<span x-text="formatDate(selectedDate)"></span>
</span>
<svg class="h-3.5 w-3.5 text-slate-400 transition-transform duration-200" :class="open ? 'rotate-180' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
<path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
</svg>
</button>

<input type="hidden" name="scheduled_date" :value="selectedDate" required>

<div
id="cluster-planned-date-calendar"
x-show="open"
@click.outside="open = false"
class="absolute left-0 mt-1.5 edify-calendar-popover edify-surface border border-slate-200 rounded-surface shadow-xl p-4 z-50 space-y-3 select-none"
style="display: none;"
x-transition:enter="transition ease-out duration-100"
x-transition:enter-start="opacity-0 transform scale-95"
x-transition:enter-end="opacity-100 transform scale-100"
x-transition:leave="transition ease-in duration-75"
x-transition:leave-start="opacity-100 transform scale-100"
x-transition:leave-end="opacity-0 transform scale-95"
>
<div class="flex items-center justify-between px-1">
<button type="button" @click="prevMonth()" aria-label="Previous month" class="h-6 w-6 flex items-center justify-center rounded-control hover:bg-slate-50 text-slate-500 hover:text-slate-700 transition-colors">
<svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
</button>
<span class="font-semibold text-[12px] text-[var(--edify-text)]" x-text="months[currentMonth] + ' ' + currentYear"></span>
<button type="button" @click="nextMonth()" aria-label="Next month" class="h-6 w-6 flex items-center justify-center rounded-control hover:bg-slate-50 text-slate-500 hover:text-slate-700 transition-colors">
<svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" /></svg>
</button>
</div>

<div class="grid grid-cols-7 gap-y-1 text-center edify-text-caption font-bold text-slate-400" aria-hidden="true">
<div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
</div>

<div class="grid grid-cols-7 gap-y-1 text-center text-[12px] font-bold">
<template x-for="(day, index) in days" :key="index">
<div>
<button
type="button"
x-show="day !== null"
@click="selectDay(day)"
class="h-7 w-7 flex items-center justify-center rounded-control transition-all focus:outline-none"
:class="isSelected(day) ? 'bg-[var(--edify-text)] text-white shadow-sm' : 'text-slate-600 hover:bg-slate-50'"
x-text="day"
></button>
</div>
</template>
</div>
</div>
</div>

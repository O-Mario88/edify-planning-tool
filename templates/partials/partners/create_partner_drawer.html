{% load frontend_filters %}
<div class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4" x-data="{ open: true }" x-show="open">
  <div class="bg-white rounded-surface border border-slate-200 shadow-xl w-full max-w-lg overflow-hidden animate-fade-in" @click.outside="open = false; $el.remove()">
    <header class="flex items-center justify-between px-5 py-4 border-b border-slate-100 bg-slate-50/50">
      <div>
        <span class="edify-page-eyebrow">Delivery Partner</span>
        <h2 class="text-[16px] font-bold text-slate-800 tracking-tight">Onboard New Partner</h2>
      </div>
      <button type="button" @click="open = false; $el.remove()" class="text-slate-400 hover:text-slate-600 transition-colors p-1 rounded-md">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </header>

    <form method="post" action="{% url 'frontend:create_partner' %}" class="p-5 space-y-4">
      {% csrf_token %}

      <div>
        <label class="block text-[12px] font-semibold text-slate-700 mb-1">Partner Organisation Name <span class="text-rose-500">*</span></label>
        <input type="text" name="name" required placeholder="e.g. Hope Education Initiative" class="w-full rounded-md border border-slate-200 px-3 py-2 text-[13px] font-medium shadow-xs focus:ring-2 focus:ring-sky-500 focus:outline-none">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-[12px] font-semibold text-slate-700 mb-1">Region</label>
          <select name="region_name" class="w-full rounded-md border border-slate-200 px-3 py-2 text-[13px] font-medium shadow-xs focus:ring-2 focus:ring-sky-500 focus:outline-none bg-white">
            <option value="">Select Region...</option>
            {% for r in regions %}
            <option value="{{ r.name }}">{{ r.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label class="block text-[12px] font-semibold text-slate-700 mb-1">Linked SSA Intervention <span class="text-rose-500">*</span></label>
          <select name="ssa_intervention" required class="w-full rounded-md border border-slate-200 px-3 py-2 text-[13px] font-medium shadow-xs focus:ring-2 focus:ring-sky-500 focus:outline-none bg-white">
            <option value="">Select Intervention...</option>
            {% for val, label in interventions %}
            <option value="{{ val }}">{{ label }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-[12px] font-semibold text-slate-700 mb-1">Contact Person</label>
          <input type="text" name="contact_person" placeholder="e.g. Jane Doe" class="w-full rounded-md border border-slate-200 px-3 py-2 text-[13px] font-medium shadow-xs focus:ring-2 focus:ring-sky-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-[12px] font-semibold text-slate-700 mb-1">Email Address</label>
          <input type="email" name="email" placeholder="contact@partner.org" class="w-full rounded-md border border-slate-200 px-3 py-2 text-[13px] font-medium shadow-xs focus:ring-2 focus:ring-sky-500 focus:outline-none">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-[12px] font-semibold text-slate-700 mb-1">Phone Number</label>
          <input type="text" name="phone" placeholder="+256 700 000 000" class="w-full rounded-md border border-slate-200 px-3 py-2 text-[13px] font-medium shadow-xs focus:ring-2 focus:ring-sky-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-[12px] font-semibold text-slate-700 mb-1">Notes / Expertise</label>
          <input type="text" name="notes" placeholder="e.g. Specialises in Leadership Training" class="w-full rounded-md border border-slate-200 px-3 py-2 text-[13px] font-medium shadow-xs focus:ring-2 focus:ring-sky-500 focus:outline-none">
        </div>
      </div>

      <div class="flex items-center justify-end gap-2.5 pt-3 border-t border-slate-100">
        <button type="button" @click="open = false; $el.remove()" class="px-4 py-2 rounded-control border border-slate-200 text-[12px] font-semibold text-slate-600 hover:bg-slate-50 transition-all">Cancel</button>
        <button type="submit" class="px-4 py-2 rounded-control bg-sky-600 hover:bg-sky-700 text-white text-[12px] font-semibold uppercase tracking-wider shadow-sm transition-all">Onboard Partner</button>
      </div>
    </form>
  </div>
</div>

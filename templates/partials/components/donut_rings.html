{% comment %}Legacy donut payload rendered as measured horizontal bars.{% endcomment %}
<div class="edify-stat-bars" aria-label="{{ donut_label|default:'Breakdown' }}">
  <p class="edify-stat-bars__headline">{{ headline }}{{ headline_unit }}{% if subline %} · {{ subline }}{% endif %}</p>
  {% for ring in donut.rings %}
  <div class="edify-stat-bars__row">
    <span>{{ ring.label }}</span><strong>{{ ring.display }}</strong>
    <div class="edify-stat-bars__track"><span style="width:{{ ring.percent }}%"></span></div>
  </div>
  {% empty %}<p class="edify-text-muted">No measured data</p>{% endfor %}
</div>

{% comment %}Disbursement queue filters. Re-render the workspace root on change.{% endcomment %}
  <form id="disb-filters" hx-get="/disbursements" hx-target="#disb-root" hx-swap="innerHTML" hx-trigger="change, search" hx-indicator="#fund-workspace-updating"
        class="platform-filter-bar grid grid-cols-2 md:grid-cols-3 gap-2.5">
    <label class="block">
      <span class="edify-text-caption font-bold uppercase tracking-wider text-slate-400">Financial Year</span>
      <select aria-label="Fiscal year" name="fy" class="mt-1 w-full h-9 px-2 rounded-control border border-slate-200 text-[12px] font-semibold text-slate-700 bg-slate-50 focus:outline-none">
        {% for opt in fy_options %}<option value="{{ opt }}" {% if opt == fy %}selected{% endif %}>{{ opt }}</option>{% endfor %}
      </select>
    </label>
    <label class="block">
      <span class="edify-text-caption font-bold uppercase tracking-wider text-slate-400">Month</span>
      <select aria-label="Month" name="month" class="mt-1 w-full h-9 px-2 rounded-control border border-slate-200 text-[12px] font-semibold text-slate-700 bg-slate-50 focus:outline-none">
        <option value="1" {% if month == 1 %}selected{% endif %}>January</option>
        <option value="2" {% if month == 2 %}selected{% endif %}>February</option>
        <option value="3" {% if month == 3 %}selected{% endif %}>March</option>
        <option value="4" {% if month == 4 %}selected{% endif %}>April</option>
        <option value="5" {% if month == 5 %}selected{% endif %}>May</option>
        <option value="6" {% if month == 6 %}selected{% endif %}>June</option>
        <option value="7" {% if month == 7 %}selected{% endif %}>July</option>
        <option value="8" {% if month == 8 %}selected{% endif %}>August</option>
        <option value="9" {% if month == 9 %}selected{% endif %}>September</option>
        <option value="10" {% if month == 10 %}selected{% endif %}>October</option>
        <option value="11" {% if month == 11 %}selected{% endif %}>November</option>
        <option value="12" {% if month == 12 %}selected{% endif %}>December</option>
      </select>
    </label>
    <label class="block">
      <span class="edify-text-caption font-bold uppercase tracking-wider text-slate-400">Fund Status</span>
      <select aria-label="Status" name="status" class="mt-1 w-full h-9 px-2 rounded-control border border-slate-200 text-[12px] font-semibold text-slate-700 bg-slate-50 focus:outline-none">
        <option value="">All Statuses</option>
        {% for s in status_options %}<option value="{{ s }}" {% if status_filter == s %}selected{% endif %}>{{ s }}</option>{% endfor %}
      </select>
    </label>
  </form>

<div
x-data="{
chart: null,
initChart() {
if (this.chart) this.chart.destroy();
/* Shared dual-axis form from EdifyChartSystem — the achievement line
   keeps green because it is a rate against target, not a peer series. */
const options = window.EdifyChartSystem.mixedTrend(3);
options.series = [
  { name: 'Planned', type: 'column', data: {{ performance_overview.planned|escape }} },
  { name: 'Achieved', type: 'column', data: {{ performance_overview.achieved|escape }} },
  { name: 'Achievement %', type: 'line', data: {{ performance_overview.pct|escape }} }
];
options.chart.height = 240;
options.colors = [window.EdifyChartSystem.comparisonSeries[0], window.EdifyChartSystem.comparisonSeries[1], 'var(--edify-chart-green)'];
options.stroke.colors = ['transparent', 'transparent', 'var(--edify-chart-green)'];
options.labels = {{ performance_overview.labels|escape }};
options.xaxis.type = 'category';
options.yaxis = [
  window.EdifyChartSystem.countAxis('Activities'),
  { show: false },
  window.EdifyChartSystem.rateAxis('Achievement %')
];
this.chart = window.EdifyChartSystem.renderDetached(document.querySelector('#performanceChart'), options);
}
}"
x-init="initChart()"
class="edify-surface rounded-surface p-5 shadow-sm space-y-3"
>

<div class="flex items-start justify-between">
  <div>
    <h3 class="text-[14px] font-semibold text-slate-800 tracking-tight">Performance Overview</h3>
    <p class="edify-text-caption text-slate-400 font-normal mt-0.5">Planned vs Achieved activities across the fiscal year</p>
  </div>
</div>

<div class="h-[240px] w-full" id="performanceChart"></div>
</div>

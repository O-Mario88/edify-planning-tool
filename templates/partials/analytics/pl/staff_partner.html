{% load frontend_filters %}
<div class="edify-surface rounded-surface border border-slate-100 shadow-sm p-5 space-y-3"
     x-data="{
       chart: null,
       initChart() {
         if (this.chart) { this.chart.destroy(); }
         const el = document.querySelector('#plStaffPartnerChart');
         if (!el) return;
         /* Shared form from EdifyChartSystem so every chart in the app
            carries one geometry, grid, legend and tooltip. */
         const cfg = window.EdifyChartSystem.comparisonBar({});
         cfg.series = [
           { name: 'Team Staff', data: {{ staff_partner.staff|escape }} },
           { name: 'Partners', data: {{ staff_partner.partner|escape }} }
         ];
         cfg.chart.height = 240;
         cfg.labels = {{ staff_partner.labels|escape }};
         cfg.xaxis.type = 'category';
         cfg.dataLabels = { enabled: true, offsetY: -16,
           style: { fontSize: '12px', colors: ['var(--edify-text-muted)'], fontWeight: 700 },
           formatter: (v, o) => (window.EdifyChartSystem.barLabelFits(o) ? v : '') };
         cfg.plotOptions.bar.dataLabels = { position: 'top' };
         cfg.grid = { show: false };
         cfg.legend.horizontalAlign = 'right';
         this.chart = new ApexCharts(el, cfg);
         this.chart.render();
       }
     }" x-init="$nextTick(() => initChart())">
  <h3 class="text-[13px] font-bold text-slate-800 tracking-tight">I. Staff &amp; Partner Performance</h3>
  <p class="edify-text-caption text-slate-400 font-medium -mt-1">Completed activities: team staff vs partners</p>
  <div class="h-[240px] w-full" id="plStaffPartnerChart"></div>
</div>

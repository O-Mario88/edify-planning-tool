{% load frontend_filters %}
<div class="edify-surface rounded-surface border border-slate-100 shadow-sm p-5 space-y-3"
     x-data="{
       chart: null,
       ids: [{% for r in target_by_pl.rows %}'{{ r.id }}'{% if not forloop.last %},{% endif %}{% endfor %}],
       initChart() {
         if (this.chart) { this.chart.destroy(); }
         const el = document.querySelector('#cdTargetPlChart');
         if (!el) return;
         const self = this;
         this.chart = new ApexCharts(el, {
           series: [
             { name: 'Target Achievement %', data: [{% for r in target_by_pl.rows %}{{ r.pl_pct }}{% if not forloop.last %},{% endif %}{% endfor %}] },
             { name: 'CCEO Average %', data: [{% for r in target_by_pl.rows %}{{ r.cceo_avg }}{% if not forloop.last %},{% endif %}{% endfor %}] }
           ],
           chart: { height: 268, type: 'bar', toolbar: { show: false }, fontFamily: 'Geist, sans-serif',
                    events: { dataPointSelection: (e, ctx, cfg) => {
                      const id = self.ids[cfg.dataPointIndex];
                      if (id) window.htmx && window.htmx.ajax('GET',
                        '/analytics/country-director/drilldown?drill=pl&id=' + id + '&fy={{ fy }}',
                        { target: '#drawer-container', swap: 'innerHTML' });
                    } } },
           colors: window.EdifyChartSystem.comparisonSeries.slice(0, 2),
           /* Wider than the platform default because this chart plots a handful
              of PLs, and the extra width is what separates the two adjacent
              value labels. */
           plotOptions: { bar: { columnWidth: '78%', dataLabels: { position: 'top' } } },
           /* Two series share each category, so the labels sit on narrow
              adjacent bars. The shared 12px floor keeps a four-character value
              such as 208% readable; the fit guard below suppresses a label
              rather than wrapping or forcing the chart wider. Never use double quotes
              in here: this whole object is an x-data attribute. */
           dataLabels: { enabled: true, offsetY: -16, style: { fontSize: '12px', fontWeight: 700, colors: ['var(--edify-text-muted)'] },
                         formatter: (v, o) => (window.EdifyChartSystem.barLabelFits(o) ? v + '%' : '') },
           labels: [{% for r in target_by_pl.rows %}'{{ r.name|escapejs }}'{% if not forloop.last %},{% endif %}{% endfor %}],
           xaxis: { axisBorder: { show: false }, axisTicks: { show: false },
                    labels: { style: { colors: 'var(--edify-text-subtle)', fontSize: '12px', fontWeight: '600' }, rotate: 0, hideOverlappingLabels: false } },
           /* Target achievement can exceed 100%. A hard max: 100 drew those bars
              outside the plot area and stacked both series' labels on the
              clipped ceiling, so the axis grows to fit the data and keeps ~15%
              headroom for the above-bar label. It still frames 0-100% whenever
              nobody is over target. */
           yaxis: { min: 0, max: v => Math.max(100, Math.ceil(v * 1.15)),
                    labels: { formatter: v => Math.round(v) + '%', style: { colors: 'var(--edify-text-subtle)', fontSize: '12px' } } },
           grid: { show: false },
           legend: { position: 'top', horizontalAlign: 'left', fontSize: '12px', fontWeight: 600, labels: { colors: 'var(--edify-text-muted)' }, markers: { radius: 12 } },
           tooltip: { theme: 'dark', shared: true, intersect: false }
         });
         this.chart.render();
       }
     }" x-init="$nextTick(() => initChart())">
  <div>
    <h3 class="text-[13px] font-bold text-slate-800 tracking-tight">3. Target Achievement by PL and CCEO</h3>
    <p class="edify-text-caption text-slate-400 font-medium mt-0.5">PL vs supervised-CCEO average · click a PL for the performance drawer</p>
  </div>
  {% if target_by_pl.rows %}
  <div class="h-[268px] w-full" id="cdTargetPlChart"></div>
  {% else %}
  <div class="h-[268px] flex items-center justify-center text-[12px] text-slate-400 font-medium">No PL portfolios with targets yet.</div>
  {% endif %}
</div>

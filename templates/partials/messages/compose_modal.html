{% load frontend_filters %}
<!-- Compose popup: page-local dialog on the shared popup surface; the page owns the composeOpen flag. -->
<div x-show="composeOpen" x-cloak class="edify-popup-dialog" role="dialog" aria-modal="true" aria-labelledby="compose-message-title"
     @keydown.escape.window="composeOpen = false" style="display: none;">
  <div class="edify-popup-dialog__backdrop" @click="composeOpen = false"></div>
  <div class="edify-popup-dialog__surface" x-data="composeModal()">
    <div class="drawer-header">
      <h3 id="compose-message-title" class="text-[15px] font-semibold text-slate-800">New message</h3>
      <button type="button" @click="composeOpen = false" aria-label="Close new message dialog" class="h-8 w-8 inline-flex items-center justify-center rounded-control text-slate-400 hover:text-slate-600">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <form method="post" action="/messages/new/" enctype="multipart/form-data" class="drawer-body space-y-4">
      {% csrf_token %}
      <input type="hidden" name="context_type" :value="ctxType">
      <input type="hidden" name="context_id" :value="ctxId">
      <template x-for="r in to" :key="r.id"><input type="hidden" name="recipient_ids" :value="r.id"></template>
      <template x-for="r in cc" :key="r.id"><input type="hidden" name="cc_ids" :value="r.id"></template>

      <p x-show="!ctxId" class="edify-note edify-text-caption font-semibold" data-tone="warning">Context is required — every message links to a workflow record.</p>

      <div class="space-y-1">
        <label for="compose-context-type" class="block edify-text-caption font-semibold text-slate-600">Context type <span class="text-rose-500">*</span></label>
        <select id="compose-context-type" x-model="ctxTab" aria-label="Context type"
                @change="ctxId=''; ctxLabel=''; loadRecords()"
                class="w-full h-10 px-3 rounded-control border border-slate-200 text-[16px] sm:text-[13px] font-medium text-slate-700 cursor-pointer">
          <option value="" disabled selected>Select…</option>
          {% for key, label in context_tabs %}<option value="{{ key }}">{{ label }}</option>{% endfor %}
        </select>
      </div>

      <div class="space-y-1">
        <label for="compose-context-search" class="block edify-text-caption font-semibold text-slate-600">Context record <span class="text-rose-500">*</span></label>
        <template x-if="ctxId">
          <div class="h-10 px-3 flex items-center gap-2 rounded-control border border-emerald-200 bg-emerald-50/50">
            <svg class="h-4 w-4 text-emerald-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span class="text-[13px] font-semibold text-slate-700 truncate flex-1" x-text="ctxLabel"></span>
            <button type="button" @click="ctxId=''; ctxLabel=''" aria-label="Clear context record" class="text-slate-400 hover:text-slate-600">&times;</button>
          </div>
        </template>
        <template x-if="!ctxId">
          <div>
            <input id="compose-context-search" type="search" placeholder="Search records…" :disabled="!ctxTab"
                   @keyup.debounce.300ms="loadRecords($event.target.value)"
                   class="w-full h-10 px-3 rounded-control border border-slate-200 text-[16px] sm:text-[13px] font-medium disabled:bg-slate-50 disabled:text-slate-300">
            <div id="modal-records" class="mt-1.5 space-y-1 max-h-36 overflow-y-auto"></div>
          </div>
        </template>
      </div>

      <div class="space-y-1">
        <label for="compose-category" class="block edify-text-caption font-semibold text-slate-600">Category <span class="text-rose-500">*</span></label>
        <select id="compose-category" aria-label="Category" name="category" x-model="category" required
                class="w-full h-10 px-3 rounded-control border border-slate-200 text-[16px] sm:text-[13px] font-medium text-slate-700 cursor-pointer">
          <option value="" disabled selected>Select…</option>
          {% for c in categories %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
        </select>
      </div>

      <div class="space-y-1">
        <label for="compose-recipient-add" class="block edify-text-caption font-semibold text-slate-600">Recipients <span class="text-rose-500">*</span></label>
        <div class="min-w-0 min-h-10 px-2 py-1.5 flex items-center flex-wrap gap-1.5 rounded-control border border-slate-200">
          <template x-for="r in to" :key="r.id">
            <span class="inline-flex items-center gap-1 pl-2 pr-1 py-0.5 rounded-pill edify-primary-soft edify-text-caption font-semibold edify-primary-text">
              <span x-text="r.name"></span>
              <button type="button" @click="to = to.filter(x=>x.id!==r.id)" :aria-label="'Remove ' + r.name" class="edify-primary-text edify-primary-text-hover">&times;</button>
            </span>
          </template>
          <select id="compose-recipient-add" @change="pick($event)" aria-label="Add recipient"
                  class="flex-1 min-w-[130px] h-8 text-[16px] sm:text-[13px] font-medium text-slate-500 bg-transparent border-0 focus:outline-none cursor-pointer">
            <option value="">Add recipient…</option>
            {% for r in recipients %}<option value="{{ r.id }}|{{ r.name }}|{{ r.role }}">{{ r.name }} ({{ r.role }})</option>{% endfor %}
          </select>
        </div>
        <div id="modal-suggestions" class="pt-1"></div>
      </div>

      <div class="space-y-1">
        <label for="compose-subject" class="block edify-text-caption font-semibold text-slate-600">Subject <span class="text-rose-500">*</span></label>
        <input id="compose-subject" type="text" name="subject" x-model="subject" required placeholder="What is this about?"
               class="w-full h-10 px-3 rounded-control border border-slate-200 text-[16px] sm:text-[13px] font-medium">
      </div>

      <div class="space-y-1">
        <label for="compose-body" class="block edify-text-caption font-semibold text-slate-600">Message <span class="text-rose-500">*</span></label>
        <div class="rounded-control border border-slate-200 overflow-hidden">
          <div class="flex items-center gap-0.5 px-2 py-1 border-b border-slate-100">
            <button type="button" @click="wrap('**')" class="h-7 w-7 rounded-control hover:bg-slate-100 text-slate-500 text-[12px] font-bold" title="Bold">B</button>
            <button type="button" @click="wrap('_')" class="h-7 w-7 rounded-control hover:bg-slate-100 text-slate-500 text-[12px] italic font-bold" title="Italic">I</button>
            <button type="button" @click="wrap('__')" class="h-7 w-7 rounded-control hover:bg-slate-100 text-slate-500 text-[12px] font-bold underline" title="Underline">U</button>
            <span class="w-px h-4 bg-slate-200 mx-1" aria-hidden="true"></span>
            <button type="button" @click="insertLine('- ')" class="h-7 w-7 rounded-control hover:bg-slate-100 text-slate-400 flex items-center justify-center" title="List">
              <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h.01M4 12h.01M4 18h.01M8 6h12M8 12h12M8 18h12"/></svg>
            </button>
            <button type="button" @click="insertLine('> ')" class="h-7 w-7 rounded-control hover:bg-slate-100 text-slate-400 flex items-center justify-center" title="Quote">
              <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
            </button>
          </div>
          <textarea id="compose-body" name="body" x-model="body" x-ref="editor" rows="4" required placeholder="Type your message…"
                    class="w-full px-3 py-2 border-0 text-[16px] sm:text-[13px] font-medium focus:outline-none resize-none"></textarea>
        </div>
      </div>

      <div class="space-y-1" x-data="{ files: [] }">
        <label for="compose-attachments" class="block edify-text-caption font-semibold text-slate-600">Attachments <span class="font-normal text-slate-500">(optional)</span></label>
        <label class="block border border-dashed border-slate-200 rounded-control p-3 text-center cursor-pointer">
          <input id="compose-attachments" type="file" name="attachments" multiple class="hidden" accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg" @change="files = Array.from($event.target.files)">
          <span class="block edify-text-caption font-semibold text-slate-600">Drag &amp; drop or <span class="edify-primary-text">browse</span></span>
          <span class="block edify-text-caption font-medium text-slate-500">PDF, DOCX, XLSX, JPG or PNG, up to 10MB</span>
        </label>
        <ul class="space-y-1">
          <template x-for="(f, idx) in files" :key="f.name + idx">
            <li class="flex items-center gap-2 edify-text-caption">
              <span class="font-semibold text-slate-700 truncate flex-1" x-text="f.name"></span>
              <span class="text-slate-500" x-text="(f.size/1024).toFixed(0)+' KB'"></span>
            </li>
          </template>
        </ul>
      </div>

      <div class="drawer-footer">
        <button type="button" @click="composeOpen = false" class="btn btn-secondary h-8">Cancel</button>
        <button type="submit" name="action" value="draft" form="" formnovalidate
                @click="submitForm('draft')"
                class="btn btn-secondary h-8">Save draft</button>
        <button type="button" @click="submitForm('send')" :disabled="!canSend"
                :class="canSend ? '' : 'opacity-50 cursor-not-allowed'"
                class="btn btn-primary h-8">Send message</button>
      </div>
    </form>
  </div>
</div>

<script>
function composeModal() {
  return {
    ctxTab: '', ctxType: '', ctxId: '', ctxLabel: '',
    category: '', subject: '', body: '',
    to: [], cc: [],
    get canSend() { return !!(this.ctxId && this.to.length && this.category && this.subject.trim() && this.body.trim()); },
    loadRecords(q) {
      if (!this.ctxTab) return;
      htmx.ajax('GET', `/messages/new/records?type=${encodeURIComponent(this.ctxTab)}&q=${encodeURIComponent(q||'')}&target=modal`, '#modal-records');
    },
    setRecord(d) {
      this.ctxType = d.type; this.ctxId = d.id; this.ctxLabel = d.label;
      htmx.ajax('GET', `/messages/new/suggestions?type=${encodeURIComponent(this.ctxType)}&id=${encodeURIComponent(this.ctxId)}&compact=1`, '#modal-suggestions');
    },
    pick(ev) {
      const v = ev.target.value; ev.target.value = '';
      if (!v) return;
      const [id, name, role] = v.split('|');
      if (!this.to.find(x=>x.id===id)) this.to.push({id, name, role});
    },
    addRecipient(r) { if (!this.to.find(x=>x.id===r.id)) this.to.push(r); },
    wrap(tok) { const t=this.$refs.editor,s=t.selectionStart,e=t.selectionEnd,sel=t.value.slice(s,e)||'text'; t.value=t.value.slice(0,s)+tok+sel+tok+t.value.slice(e); this.body=t.value; t.focus(); },
    insertLine(p) { const t=this.$refs.editor; t.value+=(t.value&&!t.value.endsWith('\n')?'\n':'')+p; this.body=t.value; t.focus(); },
    submitForm(action) {
      if (action === 'send' && !this.canSend) return;
      const form = this.$el.querySelector('form');
      const inp = document.createElement('input');
      inp.type='hidden'; inp.name='action'; inp.value=action;
      form.appendChild(inp);
      form.submit();
    },
    init() {
      this.$el.addEventListener('set-modal-record', e => this.setRecord(e.detail));
      this.$el.addEventListener('add-modal-recipient', e => this.addRecipient(e.detail));
    },
  };
}
</script>

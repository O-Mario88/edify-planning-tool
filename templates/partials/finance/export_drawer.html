{% extends "components/drawers/base_drawer.html" %}
{% load frontend_filters %}

{% block drawer_title %}Export consolidated allocation for {{ selected_month }} {{ selected_fy }}{% endblock %}
{% block drawer_subtitle %}{% endblock %}

{% block drawer_body %}
<form
method="GET"
action="/finance/fund-allocation"
class="space-y-4 text-[12px] text-slate-600"
>
<!-- Force CSV trigger -->
<input type="hidden" name="export" value="csv">
<!-- Retain month/fy context -->
<input type="hidden" name="month" value="{{ selected_month }}">
<input type="hidden" name="fy" value="{{ selected_fy }}">

<div class="space-y-1">
<label for="export_mode" class="block edify-text-caption font-semibold text-slate-600">Sections to include</label>
<select
name="export_mode"
id="export_mode"
class="w-full h-10 px-3 rounded-control border border-slate-200 text-[13px] bg-slate-50 focus:outline-none focus:ring-2 edify-primary-focus"
>
<option value="full">Full monthly allocation (combined)</option>
<option value="field_only">Field activity allocation only</option>
<option value="admin_only">Admin budget only (CD items)</option>
</select>
</div>

<div class="drawer-footer">
<button type="button" @click="requestClose()" class="btn btn-secondary h-8">Cancel</button>
<button
type="submit"
@click="setTimeout(() => $dispatch('close-drawer'), 150)"
class="btn btn-primary h-8"
>
Download CSV
</button>
</div>
</form>
{% endblock %}

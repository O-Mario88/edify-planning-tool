name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege by default. No job here writes to the repository, opens a
# pull request or publishes a package, so nothing needs more than read.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django-tests:
    name: Django Lint & Test Suite
    runs-on: ubuntu-latest
    # The full suite now contains more than 6,300 tests and exceeded 60 minutes
    # on GitHub's shared runner. Keep the gate intact and allow it to finish.
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edify_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/edify_ci
      JWT_SECRET: dev-secret-key-1234567890
      DJANGO_SETTINGS_MODULE: config.settings.dev

    steps:
      # Third-party actions are pinned to a full commit SHA. A moving tag is
      # a write-access grant to whoever can move it.
      # persist-credentials: false — checkout otherwise leaves the job's
      # token in .git/config, where anything that uploads the workspace
      # as an artifact carries it out with them. Nothing here pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Postgres runs out of lock slots during TransactionTestCase teardown.
      #
      # Each of those tests TRUNCATEs the whole schema when it finishes, taking
      # an ACCESS EXCLUSIVE lock on every relation, in one transaction. Counted
      # on a freshly migrated database, that is 3,787 relations: 346 tables,
      # 2,823 indexes, and 309 TOAST tables with their 309 indexes.
      #
      # The shared lock table holds max_locks_per_transaction x (max_connections
      # + max_prepared_transactions) entries. Stock is 64 x (100 + 0) = 6,400,
      # so a single flush fits and TWO DO NOT. With --parallel 4 the ceiling is
      # about 15,100 against 6,400 — the suite only survives because the four
      # workers rarely reach teardown at the same instant. When they do,
      #
      #     psycopg.errors.OutOfMemory: out of shared memory
      #     HINT:  You might need to increase max_locks_per_transaction.
      #
      # takes the test down with it. Nothing asserted anything; the casualties
      # are simply whichever suites hold real concurrent connections when the
      # collision happens — on 2026-09-22 that was approval races, ledger
      # rebuild, certification races and the audit commit seal. It is
      # intermittent because it depends on which tests happen to flush
      # together, and that reshuffles whenever a test is added or removed.
      #
      # 512 x 100 = 51,200 leaves roughly 3x headroom over four simultaneous
      # flushes, which is room for the schema to keep growing. The cost is a
      # few MB of shared memory.
      #
      # This is not a test being relaxed to get green: no test is skipped,
      # disabled or quarantined, and the assertions are untouched. It is the
      # database being given the working memory the suite has always needed.
      #
      # The setting is postmaster-level, so it cannot be set on a live server
      # and GitHub's service containers take no command line. ALTER SYSTEM
      # writes postgresql.auto.conf and the restart picks it up. The final
      # check is the point of the step: if the restart silently failed, fail
      # here rather than 25 minutes later inside an unrelated test.
      - name: Give Postgres enough lock slots for four parallel test flushes
        run: |
          set -euo pipefail
          cid="$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}' | head -1)"
          if [ -z "${cid}" ]; then
            echo "::error::No postgres:16 service container found to reconfigure." >&2
            docker ps >&2
            exit 1
          fi
          docker exec "${cid}" \
            psql -U postgres -d edify_ci \
            -c "ALTER SYSTEM SET max_locks_per_transaction = 512;"
          docker restart "${cid}"
          for _ in $(seq 1 60); do
            if docker exec "${cid}" pg_isready -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          # Read it back over the mapped port, the way Django will: this proves
          # both that the setting took and that the restarted container is
          # reachable from the runner again.
          applied="$(psql "$DATABASE_URL" -tAc "SHOW max_locks_per_transaction;" | tr -d "[:space:]")"
          echo "max_locks_per_transaction = ${applied}"
          test "${applied}" = "512"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

      # Everything below runs even when a step above failed, and the reason is
      # not tidiness. `ruff format --check` sits ahead of the suite, so for
      # eight consecutive pushes a formatting drift failed this job before a
      # single test executed — and the run reported only "failure", which
      # reads identically to a real test failure. Weeks passed with nobody
      # noticing the suite had stopped running (2026-08 audit, AUD-002).
      # `!cancelled()` keeps the job's verdict honest (a lint failure still
      # fails CI) while guaranteeing the test result is always visible.
      - name: Check for missing migrations
        if: ${{ !cancelled() }}
        run: python manage.py makemigrations --check --dry-run

      - name: Run Tests
        if: ${{ !cancelled() }}
        run: |
          # Functional tests benefit from four workers. The scale gate measures
          # strict wall-clock budgets at 15,000 schools, so run it separately
          # without competing test workers distorting the measurement.
          python manage.py test --parallel 4 --exclude-tag=scale
          python manage.py test apps.system_health.test_load_scale --tag=scale

      # The rendered CSS bundle is committed, so it can silently fall behind
      # the templates that generate it: a class added to a template renders as
      # nothing until someone rebuilds. This is the gate that catches it.
      - name: Set up Node
        if: ${{ !cancelled() }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Node dependencies
        if: ${{ !cancelled() }}
        run: npm ci

      - name: CSS bundle matches its source
        if: ${{ !cancelled() }}
        run: |
          npm run build:css
          git diff --exit-code static/css/main.css static/css/tokens.css static/build/css \
            || { echo "::error::Generated CSS is out of date — run 'npm run build:css' and commit the result"; exit 1; }

  # Chromium and the authenticated role route audit gate every push. The whole
  # cross-browser matrix used to run here as well, one project after another
  # with a single worker — 636 tests that could not finish in the job's thirty
  # minutes, so every main run from c7d11383 (2026-09-09) was cancelled before
  # it could report anything. Firefox, WebKit and the phone and tablet
  # emulations run nightly in Browser Matrix (browser-matrix.yml), which does
  # not gate deploys. Two shards, each with its own database and server, keep
  # this well inside the budget as the suite grows.
  browser-tests:
    name: Browser Journeys & Role Route Audit
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    uses: $/.github/workflows/browser-suite.yml
    with:
      project: chromium-desktop
      browsers: chromium
      shard: ${{ matrix.shard }}

  security:
    name: Security Scans
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      # Known-CVE scan. This is the gate that caught Django 5.2.4 sitting on
      # fifty-one published advisories, so it fails the build rather than
      # warning: a dependency advisory is not something to merge past.
      - name: Dependency CVE scan
        run: pip-audit --strict --progress-spinner off

      # Static analysis. Scoped to medium severity and medium confidence —
      # the low-confidence tier is almost entirely table names interpolated
      # into migration SQL beside their own hardcoded tuple, and drowning a
      # real finding in those is how a real finding gets ignored.
      - name: Static security analysis
        run: bandit -r apps config -ll -ii

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: JavaScript dependency audit
        run: npm audit --audit-level=high

      # Workflow-level security: unpinned actions, injectable expressions,
      # over-broad permissions, secrets reachable from fork code. The
      # workflows are as much a supply chain as the dependencies are.
      - name: Lint the workflows themselves
        run: |
          python -m pip install zizmor
          # .github/ rather than .github/workflows/: the Dependabot config is
          # part of the supply chain too, and it is not a workflow file.
          zizmor --persona=regular .github/

      # The image is built on every push, not only on the nightly scan: a
      # Dockerfile change that breaks the build or ships a Critical CVE should
      # fail on the commit that made it, not the next morning.
      - name: Build the production image
        run: docker build -t edify-ci:${{ github.sha }} .

      - name: The image does not run as root
        run: |
          user=$(docker image inspect --format '{{.Config.User}}' \
            edify-ci:${{ github.sha }})
          test -n "$user" && test "$user" != "root" && test "$user" != "0" \
            || { echo "::error::the runtime image runs as root"; exit 1; }
          echo "runtime user: $user"

      - name: The runtime user can import the application
        run: |
          docker run --rm --entrypoint python \
            -e DJANGO_SETTINGS_MODULE=config.settings.collectstatic \
            edify-ci:${{ github.sha }} \
            -c 'import config.settings.collectstatic; print("runtime import: ok")'

      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: edify-ci:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

name: Browser suite

# One Playwright project (or one shard of it) against a disposable server:
# its own Postgres and Redis, a freshly migrated and demo-seeded database, and
# `runserver`, as a developer runs it locally. CI calls this for Chromium and
# the role route audit on every push; Browser Matrix calls it nightly for the
# other engines and devices. Every call is a job of its own, so shards and
# projects never share a database, a server or a CPU.
on:
  workflow_call:
    inputs:
      project:
        description: Playwright project to run, as named in playwright.config.js.
        required: true
        type: string
      browsers:
        description: >-
          Browser runtimes to install, space separated. Include chromium: the
          seeded-accounts setup project every browser project depends on runs
          in Chromium.
        required: true
        type: string
      shard:
        description: Playwright shard to run, as current/total.
        required: false
        type: string
        default: "1/1"

permissions:
  contents: read

jobs:
  playwright:
    name: ${{ inputs.project }} ${{ inputs.shard }}
    runs-on: ubuntu-latest
    # Setup takes about six minutes (dependencies, browsers, migrations and
    # the demo seed); a shard is sized to finish well inside the rest.
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edify_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/edify_e2e
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: dev-secret-key-1234567890
      DJANGO_SETTINGS_MODULE: config.settings.dev
      ENABLE_DEV_SEED: "true"
      # Sign-in is limited to 10 attempts a minute per address. A browser run
      # signs in from one address far faster than a person — the setup project
      # alone signs in fourteen accounts back to back — and a refused sign-in
      # failed specs that had nothing to do with the limit. The limit itself
      # is covered by the Django suite.
      RATE_LIMIT_LOGIN_PER_MIN: "1000"
      E2E_PROJECT: ${{ inputs.project }}
      E2E_BROWSERS: ${{ inputs.browsers }}
      E2E_SHARD: ${{ inputs.shard }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements/*.txt

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt
          npm ci

      - name: Install browser runtimes
        run: |
          read -r -a browsers <<< "$E2E_BROWSERS"
          npx playwright install --with-deps "${browsers[@]}"

      - name: Prepare browser-test database
        run: |
          python manage.py migrate --noinput
          python manage.py seed --demo

      - name: Run browser journeys and authenticated route inventory
        run: |
          python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/edify-e2e-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health/live >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/edify-e2e-server.log
              exit 1
            fi
            sleep 1
          done
          npx playwright test --project="$E2E_PROJECT" --shard="$E2E_SHARD" || {
            cat /tmp/edify-e2e-server.log
            exit 1
          }

      # Artifact names are unique within a run and cannot contain a slash.
      - name: Name the failure evidence
        if: ${{ failure() }}
        run: echo "EVIDENCE_NAME=playwright-failure-evidence-${E2E_PROJECT}-shard-${E2E_SHARD/\//-of-}" >> "$GITHUB_ENV"

      - name: Upload browser failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: ${{ env.EVIDENCE_NAME }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
